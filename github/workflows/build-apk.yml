name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP & Build APK
      run: |
        sudo apt-get update && sudo apt-get install -y unzip
        mkdir -p www
        
        
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE" -d temp_extract
          # ZIP ke andar jahan bhi HTML/CSS/JS hain unhe www mein move karein
          find temp_extract -type f -exec cp {} www/ \;
        fi


        if [ ! -f www/index.html ]; then
          ANY_HTML=$(find www/ -name "*.html" | head -n 1)
          if [ -n "$ANY_HTML" ]; then
            mv "$ANY_HTML" www/index.html
          fi
        fi

        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init AnimeVerse com.animeverse.app --web-dir www
        npx cap add android
        npx cap sync android

        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnimeVerse-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
