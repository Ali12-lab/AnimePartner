name: Build Anime Partner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project packages
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Create Capacitor JSON configuration
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.cjs
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shin.animepartner",
            "appName": "Anime Partner",
            "webDir": "dist"
          }
          EOF
          cat capacitor.config.json

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Copy website into Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-partner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
